<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OTHRYS Atlas</title>
<style>
:root{color-scheme:dark;--bg:#090a0c;--rail:#111216;--panel:#121318;--line:#262832;--text:#f3f4f6;--muted:#8b8e99;--violet:#7568f3;--blue:#4b8cff;--green:#42d7a2;--rose:#e64b8e;--amber:#e1aa55}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:12px/1.4 Inter,ui-sans-serif,system-ui,sans-serif;height:100vh;overflow:hidden}button,input,select{font:inherit;color:inherit}
.app{height:100vh;display:grid;grid-template-columns:52px 220px minmax(0,1fr) 318px}.global{background:#0e0f12;border-right:1px solid #22242b;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:9px}.gmark{width:29px;height:29px;border-radius:9px;background:#f1f1f2;color:#101114;display:grid;place-items:center;font-weight:900;margin-bottom:8px}.gbtn{width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:#9295a0;cursor:pointer}.gbtn:hover,.gbtn.active{background:#1c1e24;color:#fff}.spacer{flex:1}
.side{background:var(--rail);border-right:1px solid #23252d;display:flex;flex-direction:column;min-width:0}.sidehead{height:44px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #24262e;font-weight:700}.nav{padding:11px 9px;display:grid;gap:2px}.nav button{border:0;background:transparent;text-align:left;border-radius:7px;padding:7px 9px;color:#b5b7bf;cursor:pointer}.nav button.active,.nav button:hover{background:#20222a;color:#fff}.badge{float:right;background:#252832;border:1px solid #333642;border-radius:999px;padding:0 6px;font-size:10px}.tree{min-height:0;overflow:auto;padding:3px 10px 14px}.tree h4{margin:12px 5px 6px;color:#777b86;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.tree-row{display:flex;justify-content:space-between;gap:8px;padding:4px 7px;border-radius:6px;color:#aeb1ba;cursor:pointer}.tree-row:hover{background:#1d1f25;color:#fff}.tree-row small{color:#696d77}
.main{display:grid;grid-template-rows:44px 1fr;min-width:0;background:#090a0c}.top{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #22242b;background:#0d0e12}.crumb{color:#858994}.crumb strong{color:#d9dbe0}.top .grow{flex:1}.search{width:min(420px,44vw);background:#14161b;border:1px solid #2b2e38;border-radius:8px;padding:7px 10px;outline:none}.search:focus{border-color:#5f59b8}.lens{display:flex;gap:3px;padding:3px;background:#15171c;border:1px solid #292c34;border-radius:9px}.lens button{border:0;background:transparent;color:#898d97;padding:5px 8px;border-radius:6px;cursor:pointer}.lens button.active{background:#f0f0f2;color:#141518}.stage{position:relative;overflow:hidden}.stage canvas{width:100%;height:100%;display:block;cursor:grab}.stage canvas.dragging{cursor:grabbing}.hud{position:absolute;left:14px;top:13px;display:flex;gap:7px;pointer-events:none}.pill{background:#111319d9;border:1px solid #2a2d35;border-radius:999px;padding:5px 8px;color:#9da0aa;backdrop-filter:blur(8px)}.pill strong{color:#fff}.legend{position:absolute;left:14px;bottom:14px;display:flex;gap:10px;align-items:center;background:#111319d9;border:1px solid #2a2d35;border-radius:9px;padding:7px 9px;color:#888c96}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}.zoom{position:absolute;right:13px;bottom:13px;display:flex;gap:4px}.zoom button{width:31px;height:31px;border:1px solid #2b2e36;background:#13151a;border-radius:8px;color:#a6a9b2;cursor:pointer}
.inspect{background:var(--panel);border-left:1px solid #24262e;display:flex;flex-direction:column;min-width:0}.ihead{height:44px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #272932;font-weight:700}.ibody{overflow:auto;padding:14px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#777b86;margin:16px 0 7px}.ibox{border:1px solid #292c34;background:#15171c;border-radius:10px;padding:11px}.ibox h2{font-size:15px;margin:0 0 4px}.meta{color:#898d97}.metric{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-top:1px solid #242730}.metric:first-child{border-top:0}.bar{height:5px;background:#242730;border-radius:99px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#7570ec}.edge-row{padding:7px 0;border-top:1px solid #23262d}.edge-row:first-child{border-top:0}.edge-row b{font-size:10px;color:#8a8e99;text-transform:uppercase}.muses{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.muse{padding:3px 6px;border:1px solid #30333c;border-radius:999px;color:#a8abb4;font-size:10px}.empty{color:#777b85;padding:8px 0}
@media(max-width:1150px){.app{grid-template-columns:44px 190px minmax(0,1fr) 270px}.global{padding-top:8px}.search{width:260px}.lens button{padding:5px 6px}}@media(max-width:850px){.app{grid-template-columns:46px minmax(0,1fr)}.side,.inspect{display:none}.search{width:min(48vw,300px)}.lens{display:none}}
</style></head><body><div class="app">
<aside class="global"><div class="gmark">O</div><button class="gbtn" title="OTHRYS OS" onclick="location.href='/'">⌂</button><button class="gbtn active" title="Atlas">◎</button><button class="gbtn" title="Mnemosyne">◇</button><button class="gbtn" title="Work">☷</button><div class="spacer"></div><button class="gbtn" title="Settings">⚙</button></aside>
<aside class="side"><div class="sidehead">Atlas</div><div class="nav"><button id="navOverview" class="active">⌂ &nbsp;Overview</button><button id="navSearch">⌕ &nbsp;Search</button><button id="navMap">◉ &nbsp;Knowledge map</button><button id="navInbox">▱ &nbsp;Inbox <span id="inboxBadge" class="badge">0</span></button><button id="navReview">☷ &nbsp;Review <span id="reviewBadge" class="badge">0</span></button></div><div id="tree" class="tree"></div></aside>
<main class="main"><header class="top"><div class="crumb"><strong>othrys-v2</strong> &nbsp;›&nbsp; Atlas</div><div class="grow"></div><input id="search" class="search" placeholder="Ask Atlas or search nodes…"><div id="lens" class="lens"><button data-lens="overview" class="active">Overview</button><button data-lens="topics">Topics</button><button data-lens="work">Work</button><button data-lens="evidence">Evidence</button></div></header><section class="stage"><canvas id="graph"></canvas><div class="hud"><span class="pill"><strong id="nodeCount">—</strong> nodes</span><span class="pill"><strong id="edgeCount">—</strong> relations</span><span class="pill">Cognitive health <strong id="health">—</strong></span></div><div class="legend"><span><i class="dot" style="background:#7568f3"></i>canonical</span><span><i class="dot" style="background:#4b8cff"></i>verified</span><span><i class="dot" style="background:#e64b8e"></i>research / conflict</span><span>size = gravity · halo = heat</span></div><div class="zoom"><button id="fit">⌗</button><button id="zin">＋</button><button id="zout">−</button></div></section></main>
<aside class="inspect"><div class="ihead"><span>Knowledge inspector</span><span id="liveState" class="meta">CONNECTING</span></div><div id="inspector" class="ibody"><div class="ibox"><h2>OTHRYS Atlas</h2><div class="meta">Select a node to inspect provenance, Muse routing, gravity, heat and relations.</div></div></div></aside>
</div><script>
const canvas=document.getElementById('graph'),ctx=canvas.getContext('2d');let graph=null,view={x:0,y:0,scale:1},selected=null,hovered=null,drag=null,filter='',lens='overview';const token=localStorage.getItem('othrys.deck.read')||'';
const palette={CANONICAL:'#7568f3',VERIFIED:'#4b8cff',REVIEWED:'#42d7a2',OBSERVED:'#8e95a3',INFERRED:'#6f7480',RESEARCH:'#e64b8e',STALE:'#b18a54',CONFLICTED:'#ee5c66',REJECTED:'#555862'};
const clusters={project:[0,0],system:[-330,-180],titan:[-290,90],capability:[-80,220],model:[250,210],integration:[350,15],knowledge:[190,-230],mission:[-70,-120],work:[-250,260],evidence:[80,320],research:[330,-210],incident:[300,100],lesson:[80,120],pattern:[-120,300],question:[380,-50],decision:[20,-280],source:[280,-320]};
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function layout(){if(!graph)return;for(const n of graph.nodes){const c=clusters[n.type]||[0,0],h=hash(n.id),r=32+(h%125),a=((h>>>8)%628)/100;n.x=c[0]+Math.cos(a)*r;n.y=c[1]+Math.sin(a)*r}}
function resize(){const d=devicePixelRatio||1,r=canvas.getBoundingClientRect();canvas.width=Math.floor(r.width*d);canvas.height=Math.floor(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);
function visible(n){if(filter){const q=filter.toLowerCase(),hay=`${n.title} ${n.description} ${n.type} ${n.truthClass} ${(n.tags||[]).join(' ')} ${(n.muses||[]).join(' ')}`.toLowerCase();if(!hay.includes(q))return false}if(lens==='work'&&!['work','mission','capability','titan','system'].includes(n.type))return false;if(lens==='evidence'&&!['evidence','knowledge','research','mission','work'].includes(n.type))return false;if(lens==='topics'&&!['knowledge','research','lesson','pattern','decision','question'].includes(n.type))return false;return true}
function screen(n){const r=canvas.getBoundingClientRect();return{x:r.width/2+view.x+n.x*view.scale,y:r.height/2+view.y+n.y*view.scale}}
function draw(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);if(!graph)return;const visibleIds=new Set(graph.nodes.filter(visible).map(n=>n.id));ctx.lineWidth=1;for(const e of graph.edges){if(!visibleIds.has(e.from)||!visibleIds.has(e.to))continue;const a=graph.nodes.find(n=>n.id===e.from),b=graph.nodes.find(n=>n.id===e.to),p=screen(a),q=screen(b);ctx.strokeStyle=e.basis==='INFERENCE'?'#35313f':'#272b34';ctx.globalAlpha=.7;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}ctx.globalAlpha=1;for(const n of graph.nodes){if(!visible(n))continue;const p=screen(n),radius=(4+14*n.gravity)*Math.max(.65,Math.min(1.2,view.scale)),color=palette[n.truthClass]||'#7f8490';if(n.heat>.35){ctx.beginPath();ctx.arc(p.x,p.y,radius+7+n.heat*8,0,Math.PI*2);ctx.fillStyle=color;ctx.globalAlpha=.08+.14*n.heat;ctx.fill();ctx.globalAlpha=1}ctx.beginPath();ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();if(n===selected){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}if(n===hovered||n===selected||n.gravity>.62){ctx.fillStyle='#e5e7eb';ctx.font=`${n===selected?'600 ':''}11px Inter,system-ui`;ctx.textAlign='center';ctx.fillText(n.title.slice(0,38),p.x,p.y+radius+13)}}}
function hit(x,y){if(!graph)return null;let best=null,dist=1e9;for(const n of graph.nodes){if(!visible(n))continue;const p=screen(n),r=7+16*n.gravity,d=Math.hypot(x-p.x,y-p.y);if(d<r&&d<dist){best=n;dist=d}}return best}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};canvas.classList.add('dragging')};canvas.onpointermove=e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(drag){view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;draw()}else{hovered=hit(x,y);draw()}};canvas.onpointerup=e=>{const moved=drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5;drag=null;canvas.classList.remove('dragging');if(!moved){const r=canvas.getBoundingClientRect();selected=hit(e.clientX-r.left,e.clientY-r.top);renderInspector();draw()}};canvas.onwheel=e=>{e.preventDefault();view.scale=Math.max(.35,Math.min(2.5,view.scale*(e.deltaY>0?.9:1.1)));draw()};
function renderTree(){const host=document.getElementById('tree');host.replaceChildren();const h=document.createElement('h4');h.textContent='Pages';host.append(h);for(const [type,count] of Object.entries(graph?.summary?.byType||{}).sort((a,b)=>b[1]-a[1])){const row=document.createElement('div');row.className='tree-row';row.innerHTML=`<span>◇ ${type}</span><small>${count}</small>`;row.onclick=()=>{filter=type;document.getElementById('search').value=type;draw()};host.append(row)}const mh=document.createElement('h4');mh.textContent='Nine Muses';host.append(mh);const counts={};for(const n of graph?.nodes||[])for(const m of n.muses||[])counts[m]=(counts[m]||0)+1;for(const [name,count] of Object.entries(counts).sort()){const row=document.createElement('div');row.className='tree-row';row.innerHTML=`<span>◌ ${name}</span><small>${count}</small>`;row.onclick=()=>{filter=name;document.getElementById('search').value=name;draw()};host.append(row)}}
function renderInspector(){const host=document.getElementById('inspector');if(!selected){host.innerHTML='<div class="ibox"><h2>OTHRYS Atlas</h2><div class="meta">Select a node to inspect provenance, Muse routing, gravity, heat and relations.</div></div>';return}const rel=graph.edges.filter(e=>e.from===selected.id||e.to===selected.id);const p=selected.provenance?.[0];host.innerHTML=`<div class="ibox"><div class="meta">${selected.type.toUpperCase()} · ${selected.truthClass}</div><h2>${esc(selected.title)}</h2><div class="meta">${esc(selected.description||'')}</div><div class="muses">${(selected.muses||[]).map(m=>`<span class="muse">${m}</span>`).join('')}</div></div><div class="eyebrow">Cognitive signals</div><div class="ibox"><div class="metric"><span>Gravity<div class="bar"><i style="width:${selected.gravity*100}%"></i></div></span><b>${selected.gravity.toFixed(2)}</b></div><div class="metric"><span>Heat<div class="bar"><i style="width:${selected.heat*100}%"></i></div></span><b>${selected.heat.toFixed(2)}</b></div><div class="metric"><span>Relations</span><b>${rel.length}</b></div></div><div class="eyebrow">Provenance</div><div class="ibox"><b>${esc(p?.kind||'—')}</b><div class="meta">${esc(p?.ref||'No provenance')}</div></div><div class="eyebrow">Relations</div><div class="ibox">${rel.length?rel.slice(0,18).map(e=>{const other=graph.nodes.find(n=>n.id===(e.from===selected.id?e.to:e.from));return `<div class="edge-row"><b>${e.type}</b><div>${esc(other?.title||'unknown')}</div></div>`}).join(''):'<div class="empty">No relations</div>'}</div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cognitiveHealth(g){if(!g?.nodes?.length)return 0;const verified=g.nodes.filter(n=>['CANONICAL','VERIFIED','REVIEWED'].includes(n.truthClass)).length/g.nodes.length,stale=g.nodes.filter(n=>n.truthClass==='STALE').length/g.nodes.length,conf=g.summary?.conflictCount||0,inbox=g.summary?.inboxCount||0;return Math.max(0,Math.min(100,Math.round(72*verified+18*(1-stale)+10*Math.exp(-(conf+inbox)/10))))}
async function load(){if(!token){document.getElementById('liveState').textContent='PAIR IN MAIN DECK';return}try{const r=await fetch('/api/atlas',{headers:{'X-OTHRYS-DECK-TOKEN':token},cache:'no-store'});if(!r.ok)throw new Error(String(r.status));const out=await r.json();graph=out.atlas;layout();document.getElementById('nodeCount').textContent=graph.summary.nodeCount;document.getElementById('edgeCount').textContent=graph.summary.edgeCount;document.getElementById('inboxBadge').textContent=graph.summary.inboxCount;document.getElementById('reviewBadge').textContent=graph.summary.reviewCount;document.getElementById('health').textContent=cognitiveHealth(graph)+'%';document.getElementById('liveState').textContent='LIVE';renderTree();resize()}catch(e){document.getElementById('liveState').textContent='OFFLINE'}}
document.getElementById('search').oninput=e=>{filter=e.target.value.trim();draw()};document.getElementById('lens').onclick=e=>{const b=e.target.closest('button[data-lens]');if(!b)return;lens=b.dataset.lens;document.querySelectorAll('#lens button').forEach(x=>x.classList.toggle('active',x===b));selected=null;renderInspector();draw()};document.getElementById('fit').onclick=()=>{view={x:0,y:0,scale:1};draw()};document.getElementById('zin').onclick=()=>{view.scale=Math.min(2.5,view.scale*1.2);draw()};document.getElementById('zout').onclick=()=>{view.scale=Math.max(.35,view.scale/1.2);draw()};
document.getElementById('navOverview').onclick=()=>{filter='';lens='overview';document.getElementById('search').value='';document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('navOverview').classList.add('active');draw()};document.getElementById('navMap').onclick=()=>{filter='';document.getElementById('search').value='';draw()};document.getElementById('navInbox').onclick=()=>{filter='inbox';document.getElementById('search').value='inbox';draw()};document.getElementById('navReview').onclick=()=>{filter='awaiting-review';document.getElementById('search').value='awaiting-review';draw()};document.getElementById('navSearch').onclick=()=>document.getElementById('search').focus();
load();setInterval(load,15000);
</script></body></html>
