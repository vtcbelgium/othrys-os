<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <h1>Expense Dashboard</h1>
        <button id="clear-btn" class="btn-danger">Clear All Data</button>
    </header>

    <main class="dashboard-container">
        <section class="summary-card">
            <h2>Summary</h2>
            <div class="stat-row">
                <span>Total Expenses:</span>
                <span id="total-expenses">$0.00</span>
            </div>
            <div class="stat-row">
                <span>Transaction Count:</span>
                <span id="transaction-count">0</span>
            </div>
        </section>

        <section class="input-card">
            <h2>Add Expense</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" min="0" required placeholder="e.g. 25.50">
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" required placeholder="e.g. Lunch with team">
                </div>
                <button type="submit" class="btn-primary">Add Expense</button>
            </form>
        </section>

        <section class="list-card">
            <h2>Recent Expenses</h2>
            <ul id="expense-list" aria-label="List of expenses"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
