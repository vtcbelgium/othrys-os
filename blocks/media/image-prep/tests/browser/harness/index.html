<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>block.media.image-prep harness</title>
    <script type="importmap">
      {
        "imports": {
          "@othrys-blocks/media-image-prep": "/src/index.js"
        }
      }
    </script>
  </head>
  <body>
    <p>image-prep browser harness</p>
    <script type="module">
      import {
        prepareImage,
        ImagePrepError,
        BLOCK_ID,
        ERROR_CODES,
      } from "/src/index.js";
      import { originOracleToWhiteSquare } from "/tests/browser/origin-oracle.js";

      window.prepareImage = prepareImage;
      window.ImagePrepError = ImagePrepError;
      window.BLOCK_ID = BLOCK_ID;
      window.ERROR_CODES = ERROR_CODES;
      window.originOracleToWhiteSquare = originOracleToWhiteSquare;

      window.inspect = async function inspect(out) {
        const blob = out.blob;
        const buf = new Uint8Array(await blob.arrayBuffer());
        const jpegMagic = buf[0] === 0xff && buf[1] === 0xd8;
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = () => reject(new Error("output decode failed"));
          i.src = URL.createObjectURL(blob);
        });
        const c = document.createElement("canvas");
        c.width = img.width;
        c.height = img.height;
        const ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const corners = [
          ctx.getImageData(0, 0, 1, 1).data,
          ctx.getImageData(img.width - 1, 0, 1, 1).data,
          ctx.getImageData(0, img.height - 1, 1, 1).data,
          ctx.getImageData(img.width - 1, img.height - 1, 1, 1).data,
        ].map((d) => [d[0], d[1], d[2], d[3]]);
        const center = ctx.getImageData(
          Math.floor(img.width / 2),
          Math.floor(img.height / 2),
          1,
          1,
        ).data;
        const sample = ctx.getImageData(0, 0, img.width, img.height).data;
        let nonWhiteCount = 0;
        for (let i = 0; i < sample.length; i += 16) {
          if (sample[i] < 250 || sample[i + 1] < 250 || sample[i + 2] < 250) nonWhiteCount++;
        }
        return {
          type: blob.type,
          format: out.format || blob.type,
          size: blob.size,
          width: img.width,
          height: img.height,
          jpegMagic,
          corners,
          center: [center[0], center[1], center[2], center[3]],
          nonWhiteCount,
          bboxTrimmed: out.bboxTrimmed,
          backgroundRemoved: out.backgroundRemoved,
          operationsApplied: out.operationsApplied,
          blockId: out.blockId || null,
        };
      };

      async function loadVtcAdapter() {
        try {
          const mod = await import("/vtc/whiteSquare.js");
          window.toWhiteSquare = mod.toWhiteSquare;
          window.vtcAdapterLoaded = true;
        } catch (err) {
          window.toWhiteSquare = null;
          window.vtcAdapterLoaded = false;
          window.vtcAdapterError = String(err && err.message ? err.message : err);
        }
      }

      await loadVtcAdapter();
      window.__imagePrepReady = true;
    </script>
  </body>
</html>
